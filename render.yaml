# Render Blueprint - https://render.com/docs/blueprint-spec
#
# A WEB SERVICE, not a static site. The app was a static site until
# auto-pull from Garmin was required: that needs somewhere to hold an
# OAuth credential and run a schedule, and a browser page can hold
# neither. The service serves the built app AND the sync API from one
# origin, so connect-src stays 'self' and there is no CORS.
#
# Trade to know about: a free-tier web service sleeps after ~15 minutes
# idle and cold-starts in roughly 50 seconds. Your data is unaffected -
# it lives in your browser - but the first open after a gap is slow, and
# a sleeping service does not run its sync schedule. Upgrade the instance
# if the automation matters more than the cost.
services:
  - type: web
    name: nutrition-log
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true

    disk:
      # Session tokens and the rolling Garmin window. Small on purpose:
      # this is a buffer, not the store of record.
      name: sync-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      # Required. Generate with: openssl rand -hex 32
      # The app presents this as a bearer token; without it the service
      # refuses to start, because a public URL serving someone's sleep and
      # heart-rate history to any caller must not happen by omission.
      - key: SYNC_TOKEN
        generateValue: true

      # Your Garmin Connect login. Leave unset to serve the app only and
      # keep using CSV import.
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false

      # Garmin publishes daily summaries a few times a day; polling faster
      # earns nothing and spends goodwill with their rate limiter.
      - key: SYNC_INTERVAL_MIN
        value: "180"
